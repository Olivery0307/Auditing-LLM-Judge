[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-audit"
version = "0.1.0"
description = "COMS 4995 LLM-as-a-Judge audit starter"
requires-python = ">=3.10"
dependencies = ["datasets>=2.19", "pandas>=2.0", "pyarrow>=14", "numpy>=1.24"]

[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
